name: Apply Justin Medicare dashboard
on:
  push:
    branches: [feature/justin-medicare-commission-dashboard]
    paths:
      - '.github/workflows/apply-justin-medicare-dashboard.yml'
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[justin-medicare-dashboard-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/justin-medicare-commission-dashboard
      - name: Integrate Justin Medicare commission card
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/(crm)/dashboard/page.tsx')
          text = p.read_text()
          old = "import DeferredDashboardTools from './DeferredDashboardTools'\n"
          new = old + "import JustinMedicareCommissionCard from './JustinMedicareCommissionCard'\n"
          if old not in text: raise SystemExit('dashboard import marker missing')
          text = text.replace(old, new, 1)

          old_block = '''      ) : (\n        <section className="grid grid-5 dashboard-personal-stats" style={{ marginTop: 22 }}>\n          <div className="card card-pad stat"><span>Total Clients</span><strong>{dashboardStats[0]?.totalClients || 0}</strong></div>\n          <div className="card card-pad stat"><span>Medicare Clients</span><strong>{dashboardStats[0]?.medicareClients || 0}</strong></div>\n          <div className="card card-pad stat"><span>Life Clients</span><strong>{dashboardStats[0]?.lifeClients || 0}</strong></div>\n          <div className="card card-pad stat"><span>Turning 65 in {currentYear}</span><strong>{dashboardStats[0]?.turning65 || 0}</strong></div>\n          <div className="card card-pad stat dashboard-monthly-premium-stat dashboard-premium-combined">\n            <div><span>Monthly Premium · {monthNames[currentMonth]} {currentYear}</span><strong>{money(dashboardStats[0]?.currentMonthPremium || 0)}</strong></div>\n            <div className="dashboard-premium-divider"><span>Yearly Total · {currentYear}</span><strong>{money(dashboardStats[0]?.currentYearPremium || 0)}</strong></div>\n          </div>\n        </section>\n      )}\n'''
          new_block = '''      ) : isJustinPortal ? (\n        <section className="grid grid-2 dashboard-justin-financial-stats" style={{ marginTop: 22 }}>\n          <div className="card card-pad stat dashboard-monthly-premium-stat dashboard-premium-combined">\n            <div><span>Monthly Premium · {monthNames[currentMonth]} {currentYear}</span><strong>{money(dashboardStats[0]?.currentMonthPremium || 0)}</strong></div>\n            <div className="dashboard-premium-divider"><span>Yearly Total · {currentYear}</span><strong>{money(dashboardStats[0]?.currentYearPremium || 0)}</strong></div>\n          </div>\n          <JustinMedicareCommissionCard />\n        </section>\n      ) : (\n        <section className="grid grid-5 dashboard-personal-stats" style={{ marginTop: 22 }}>\n          <div className="card card-pad stat"><span>Total Clients</span><strong>{dashboardStats[0]?.totalClients || 0}</strong></div>\n          <div className="card card-pad stat"><span>Medicare Clients</span><strong>{dashboardStats[0]?.medicareClients || 0}</strong></div>\n          <div className="card card-pad stat"><span>Life Clients</span><strong>{dashboardStats[0]?.lifeClients || 0}</strong></div>\n          <div className="card card-pad stat"><span>Turning 65 in {currentYear}</span><strong>{dashboardStats[0]?.turning65 || 0}</strong></div>\n          <div className="card card-pad stat dashboard-monthly-premium-stat dashboard-premium-combined">\n            <div><span>Monthly Premium · {monthNames[currentMonth]} {currentYear}</span><strong>{money(dashboardStats[0]?.currentMonthPremium || 0)}</strong></div>\n            <div className="dashboard-premium-divider"><span>Yearly Total · {currentYear}</span><strong>{money(dashboardStats[0]?.currentYearPremium || 0)}</strong></div>\n          </div>\n        </section>\n      )}\n'''
          if old_block not in text: raise SystemExit('personal stats block missing')
          text = text.replace(old_block, new_block, 1)
          p.write_text(text)
      - name: Add regression test
        shell: bash
        run: |
          cat > tests/justin-medicare-dashboard.test.mjs <<'EOF'
          import test from 'node:test'
          import assert from 'node:assert/strict'
          import { readFile } from 'node:fs/promises'

          test('Justin dashboard keeps premium totals and uses Medicare commission card instead of client count tiles', async () => {
            const page = await readFile('app/(crm)/dashboard/page.tsx', 'utf8')
            const card = await readFile('app/(crm)/dashboard/JustinMedicareCommissionCard.tsx', 'utf8')
            assert.match(page, /isJustinPortal \? \(/)
            assert.match(page, /<JustinMedicareCommissionCard \/>/)
            assert.match(page, /dashboard-justin-financial-stats/)
            assert.match(card, /2027: \{ initial: 725, renewal: 363 \}/)
            assert.match(card, /Medicare Commissions/)
            assert.match(card, /AEP/)
            assert.match(card, /OEP/)
            assert.match(card, /SEP/)
            assert.match(card, /T65 \/ IEP/)
            assert.match(card, /Monthly Renewal Equivalent/)
            assert.match(card, /Projected January/)
            assert.match(card, /CMS MAXIMUM ESTIMATE/)
          })
          EOF
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests
          git commit -m "[justin-medicare-dashboard-applied] Add Medicare commission totals to Justin dashboard"
          git push origin HEAD:feature/justin-medicare-commission-dashboard
