name: Apply iPhone quick tool spacing

on:
  push:
    paths:
      - '.github/workflows/iphone-quick-tool-spacing.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[iphone-tool-spacing-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase iPhone quick tool spacing
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/(crm)/dashboard/DashboardQuickTools.tsx')
          text = p.read_text()
          old = '.dashboard-quick-tools.compact{display:flex!important;grid-template-columns:none;gap:4px;margin:0 0 0 5px;padding:0}'
          new = '.dashboard-quick-tools.compact{display:flex!important;grid-template-columns:none;gap:8px;margin:0 0 0 5px;padding:0}'
          if old not in text:
              raise SystemExit('Expected iPhone quick-tool spacing rule not found')
          p.write_text(text.replace(old, new, 1))
      - name: Commit spacing update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(crm)/dashboard/DashboardQuickTools.tsx'
          git commit -m "[iphone-tool-spacing-applied] Space quick tool icons on iPhone"
          git push origin HEAD:main
