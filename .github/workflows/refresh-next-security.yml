name: Refresh patched Next.js lockfile

on:
  push:
    branches: [security/next-16-3-4]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[next-lock-refreshed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out security branch
        uses: actions/checkout@v4
        with:
          ref: security/next-16-3-4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh Next.js package and lockfile
        run: npm install next@16.3.4 --save-exact --package-lock-only

      - name: Verify high-severity audit is clear
        run: npm audit --audit-level=high

      - name: Commit refreshed dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "[next-lock-refreshed] Upgrade Next.js to 16.3.4"
            git push origin HEAD:security/next-16-3-4
          fi
